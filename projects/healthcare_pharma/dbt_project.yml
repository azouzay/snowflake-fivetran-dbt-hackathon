# ---------------------------------------------------------------------------
# Healthcare, pharma & life sciences track
#
# This is the ONLY file you need to edit to point the project at your own data.
# Everything else in this project reads from the vars below.
#
# Two subject areas, one life-sciences story: pharma's clinical trials (is the
# pipeline at risk) and healthcare's clinical decisions (are patient outcomes
# sound). They share no key, so they get their own mart and Semantic View each,
# same shape as the other two tracks having one headline and one second mart.
# ---------------------------------------------------------------------------

name: 'hol_healthcare_pharma'
version: '1.0.0'
profile: 'snowflake_hol'

# Fusion-conformant: no config-version key, and a minimum version floor.
require-dbt-version: [">=1.9.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Fivetran can land identifiers in either case depending on destination settings.
# Leaving quoting off means dbt emits unquoted (Snowflake-uppercased) names,
# which is what a standard Fivetran Snowflake destination creates.
# If you hit "invalid identifier", see snowflake/GOTCHAS.md section 3.
quoting:
  database: false
  schema: false
  identifier: false

vars:
  # ---- TRACK IDENTITY (one obvious place per project) ---------------------
  track_key: 'healthcare_pharma'
  track_name: 'Healthcare, pharma & life sciences'
  track_description: >
    Two subject areas from one Fivetran source: pharma clinical trial risk
    (enrollment, dropout, protocol amendments) and healthcare clinical
    decisions (readmission risk, treatment outcomes, cost of care). The
    governance beat is patient- and trial-subject data, not financial PII.

  # ---- WHERE YOUR RAW DATA LIVES ------------------------------------------
  # Fivetran lands your data here. The database is created by the Snowflake
  # team ahead of the lab; see snowflake/reference_setup.sql.
  source_database: 'HOL_SNOWFLAKE_INDUSTRY'

  # >>> EDIT THESE TWO LINES <<<
  # This track reads two source schemas, one per subject area. Change both to
  # your own Fivetran destination schemas:
  # <firstname>_<lastname>_pharma and <firstname>_<lastname>_healthcare
  # (all lowercase).
  #
  # Having trouble? If your Fivetran sync is slow or you hit errors you cannot
  # resolve, set these back to the instructor schemas below and keep going.
  # Nothing else in the lab needs to change.
  pharma_source_schema: 'hicham_bab_pharma'
  healthcare_source_schema: 'hicham_bab_healthcare'

models:
  hol_healthcare_pharma:
    +materialized: view
    staging:
      +tags: ['staging']
    intermediate:
      +tags: ['intermediate']
    marts:
      +materialized: table
      +tags: ['marts']
